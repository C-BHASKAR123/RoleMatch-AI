# Render Blueprint — deploy RoleMatch AI with one click from a Git repo.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: rolematch-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # app.py is a single self-contained bundle (backend + frontend embedded),
    # so no folder structure is required in the repository.
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ROLEMATCH_SECRET_KEY
        generateValue: true
      # Persistent storage: a managed Postgres database defined below.
      - key: ROLEMATCH_DATABASE_URL
        fromDatabase:
          name: rolematch-db
          property: connectionString

databases:
  - name: rolematch-db
    plan: free
    databaseName: rolematch
    user: rolematch
